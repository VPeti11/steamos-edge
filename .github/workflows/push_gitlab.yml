name: Mirror to GitLab (steamos-edge)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
    - name: Always checkout GitHub main branch
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Extract latest GitHub commit message (single line)
      id: commit_info
      run: |
        msg=$(git log -1 --pretty=format:'%B' | tr '\n' ' ')
        echo "commit_msg=$msg" >> "$GITHUB_OUTPUT"



    - name: Set up Git config with Mirror Bot identity
      run: |
        git config --global user.name "GitLab Mirror Bot"
        git config --global user.email "mirror-bot@edgedev1.gitlab"
        
    - name: Clone GitLab repo and push to main branch
      env:
        GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      run: |
        git clone https://oauth2:${GITLAB_TOKEN}@gitlab.com/edgedev1/steamos-edge.git gitlab-mirror
        cd gitlab-mirror
    
        # Check out or create 'main' branch
        if git ls-remote --exit-code --heads origin main; then
          git checkout main
        else
          git checkout -b main
        fi
    
        find . -mindepth 1 ! -name ".*" -exec rm -rf {} + 2>/dev/null || true
    
        # Go back and copy all safe folders into GitLab repo
        cd ..
        rsync -av --exclude='.git' --exclude='gitlab-mirror' --exclude='.github' ./ gitlab-mirror/
        cd gitlab-mirror
    
        git add .
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "${{ steps.commit_info.outputs.commit_msg }}"
          git push origin main
        fi


